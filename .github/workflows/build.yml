name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds both arches so electron-builder emits a single
          # latest-mac.yml covering arm64 + x64 (two jobs would overwrite it).
          - platform: macos-latest
            args: --mac --arm64 --x64
          - platform: ubuntu-22.04
            args: --linux
          - platform: windows-latest
            args: --win

    runs-on: ${{ matrix.platform }}

    env:
      # ── Apple Code Signing ─────────────────────────────────────────────────────
      # Current: unsigned CI builds (no Apple Developer Program enrollment).
      # Users must right-click → Open to bypass Gatekeeper warnings.
      #
      # To enable full Apple Developer signing + notarization:
      # 1. Enroll in Apple Developer Program ($99/year)
      # 2. Create a Developer ID Application certificate
      # 3. Export as .p12, base64-encode, add as GitHub secret CSC_LINK
      # 4. Add secrets: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      #                 APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # 5. Remove CSC_IDENTITY_AUTO_DISCOVERY below
      # See https://www.electron.build/code-signing for full setup steps.
      # ───────────────────────────────────────────────────────────────────────────
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build renderer + main (electron-vite)
        run: bunx electron-vite build

      - name: Package app (electron-builder)
        run: bunx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdashboard-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # Safe to merge: per-platform update manifests have distinct names
          # (latest-mac.yml / latest-linux.yml / latest.yml).
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
