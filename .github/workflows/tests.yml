name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  js-tests:
    name: JS (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Electron backend
        run: bun run typecheck:electron

      - name: Run JS tests
        run: bun run test:js

      - name: Run Electron backend tests
        run: bun run test:electron
